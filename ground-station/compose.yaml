services:
  ocean-pilot-gs:
    image: oceanpilot/development:base-ubuntu26
    container_name: ocean-pilot-gs
    privileged: true 
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - CMAKE_BUILD_PARALLEL_LEVEL=4
      - QT_X11_NO_MITSHM=1 
    volumes:
      - ./app:/root/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro